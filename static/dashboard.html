<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Leyla</title>
<style>/* eucalyptus order desk */
/* Order desk: eucalyptus + paper. One memorable thing (the delivery-day block on every order), everything else quiet. Tokens first, components after. */
@font-face{font-family:'Bricolage Grotesque';font-style:normal;font-weight:500 800;font-display:swap;src:url(/assets/fonts/bricolage-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF}
@font-face{font-family:'Bricolage Grotesque';font-style:normal;font-weight:500 800;font-display:swap;src:url(/assets/fonts/bricolage-latin.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
@font-face{font-family:'Figtree';font-style:normal;font-weight:400 700;font-display:swap;src:url(/assets/fonts/figtree-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF}
@font-face{font-family:'Figtree';font-style:normal;font-weight:400 700;font-display:swap;src:url(/assets/fonts/figtree-latin.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
:root{--p:#7b4dff;--pd:#6a3de8;--pl:#eee6ff;--teal:#7b4dff;--bg:#f4efff;--panel:#ffffff;--ink:#24123f;--mut:#6c5a8f;--line:#e2d7f7;--line2:#cdbdee;--nav:#ffffffb8;--navink:#24123f;--ok:#2f9d6a;--warn:#c98a1a;--bad:#d6336c;--info:#5b6cf0;--accent:#e0457b;--onp:#1a0b33;
 --grad:linear-gradient(135deg,#b794ff 0%,#e79bff 100%);--page:radial-gradient(1100px 600px at 90% -10%,#b794ff40,transparent 70%),radial-gradient(800px 500px at 0% 105%,#f0a8ff40,transparent 70%),linear-gradient(160deg,#f7f1ff 0%,#ebe0ff 55%,#f4e2ff 100%);
 --sh:0 1px 2px #24123f14;--col:#ffffff8c;--hover:#f0e8ff;--ring:#7b4dff66;--fd:'Bricolage Grotesque','Figtree',system-ui,sans-serif;--fu:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif}
[data-theme=dark]{--p:#b794ff;--pd:#a07bf5;--pl:#1b1036;--teal:#b794ff;--bg:#080311;--panel:#0f0820;--ink:#f2eaff;--mut:#b3a1d8;--line:#251840;--line2:#3a2763;--nav:#0c0618c0;--navink:#f2eaff;--ok:#6fe0a0;--warn:#f5c066;--bad:#ff7da3;--info:#9fb4ff;--accent:#ff9bd5;--onp:#1a0b33;
 --grad:linear-gradient(135deg,#b794ff 0%,#e79bff 100%);--page:radial-gradient(1100px 600px at 90% -10%,#b794ff1c,transparent 70%),radial-gradient(800px 500px at 0% 105%,#e79bff14,transparent 70%),linear-gradient(160deg,#06020e 0%,#0c0420 55%,#140a2c 100%);
 --sh:0 1px 2px #0008;--col:#0d0719a8;--hover:#1a1036;--ring:#b794ff66}
*{box-sizing:border-box}html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page) fixed,var(--bg);color:var(--ink);font:14px/1.5 var(--fu);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--p);outline-offset:2px}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}.hide{display:none!important}.mut{color:var(--mut)}.small{font-size:12.5px}
a{color:var(--p)}
/* top bar */
.nb{display:flex;align-items:center;gap:4px;height:56px;padding:0 18px;background:var(--nav);backdrop-filter:blur(10px);color:var(--navink);position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font:650 17px/1 var(--fd);letter-spacing:-.015em;padding-right:14px;white-space:nowrap}
.logo{width:28px;height:28px;border-radius:9px;background:var(--grad);color:#fff;display:grid;place-items:center}.logo svg{width:17px;height:17px;fill:currentColor;stroke:none}
[data-theme=dark] .logo{color:#1a0b33}
#nav{display:flex;justify-content:space-between;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;-webkit-mask-image:none;mask-image:none}
#nav button,#nav a.nl{border:0;background:none;color:var(--mut);padding:0 13px;height:56px;cursor:pointer;font-size:14px;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;position:relative;transition:color .15s}
#nav button:hover,#nav a.nl:hover{color:var(--ink)}
#nav button.on{color:var(--ink);font-weight:600}#nav button.on::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;border-radius:2px 2px 0 0;background:var(--p)}
.nbr{display:flex;align-items:center;gap:8px}
.nb::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,#b794ff,#e79bff,#ff9ec7,#7b4dff,#b794ff);background-size:300% 100%;animation:glow 6s linear infinite;pointer-events:none}@keyframes glow{to{background-position:300% 0}}@media(prefers-reduced-motion:reduce){.nb::after{animation:none}}
.nb select,.nb .ib{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:var(--r-ctl,8px);height:34px;padding:0 10px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background .15s,border-color .15s}
.nb select:hover,.nb .ib:hover{background:var(--hover);border-color:var(--line2)}.nb a.ib{text-decoration:none}
.agbadge{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:500;padding:5px 11px;border-radius:999px;background:var(--pl);color:var(--p);white-space:nowrap}
.agbadge i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px #2f8f5b33}
.agbadge.stopped{background:#d6336c18;color:var(--bad)}.agbadge.stopped i{background:var(--bad);box-shadow:0 0 0 3px #d6336c33}
.agbadge.maintenance{background:#d99a0020;color:#8a6100}.agbadge.maintenance i{background:var(--warn);box-shadow:0 0 0 3px #d99a0033}
[data-theme=dark] .agbadge.maintenance{color:var(--warn)}
.av{width:24px;height:24px;border-radius:50%;background:var(--pl);color:var(--p);font-size:11px;font-weight:700;display:inline-grid;place-items:center;flex:none}
.me{cursor:pointer;overflow:hidden;width:32px;height:32px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}[data-theme=dark] .me{color:#1a0b33}
/* page header */
main{padding:0 0 48px}
.cp{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:12px 16px;padding:18px 24px 14px}  /* when the buttons wrap onto a second row they stay on the right */
.cp .left{display:flex;align-items:center;gap:14px;flex:1 1 420px;min-width:0}
.crumb{font:650 24px/1.15 var(--fd);letter-spacing:-.02em;white-space:nowrap}.crumb small{font:500 14px var(--fu);color:var(--mut);letter-spacing:0}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:0 12px;height:38px;background:var(--panel);flex:0 1 340px;min-width:150px;color:var(--mut);transition:border-color .15s,box-shadow .15s}
.search:focus-within{border-color:var(--p);box-shadow:0 0 0 3px var(--ring)}.search input{border:0;background:none;outline:none;flex:1;min-width:0;color:var(--ink)}
.cp select{height:38px;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:0 10px}
.vs{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}.vs button{border:0;background:none;width:38px;height:36px;display:grid;place-items:center;cursor:pointer;color:var(--mut);transition:background .15s}
.vs button+button{border-left:1px solid var(--line)}.vs button:hover{background:var(--hover)}.vs button.on{background:var(--pl);color:var(--p)}
.cnt{color:var(--mut);font-size:13px}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line2);background:var(--panel);border-radius:var(--r-ctl,8px);padding:0 14px;height:36px;cursor:pointer;font-weight:500;transition:background .15s,border-color .15s,transform .05s;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn.busy{opacity:.55;cursor:progress}.btn:hover{background:var(--hover)}.btn:active{transform:translateY(1px)}.btn:disabled{opacity:.5;cursor:default}
.btn.p,.btn.ok{background:var(--grad);border-color:transparent;color:#fff}.btn.p:hover,.btn.ok:hover{filter:brightness(1.08)}
[data-theme=dark] .btn.p,[data-theme=dark] .btn.ok{color:#1a0b33}
.btn.bad{color:var(--bad);border-color:#d6336c55;background:transparent}.btn.bad:hover{background:#d6336c12}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
/* quick filters and the Filters panel */
.fbar{display:none;flex-wrap:wrap;gap:8px;align-items:center;padding:4px 24px 12px}.fbar.open{display:flex}
.fbar select,.fbar input{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:var(--r-ctl,8px);padding:6px 10px;font-size:13.5px;min-height:36px;max-width:100%}
.fbar select:focus,.fbar input:focus{outline:2px solid var(--p);outline-offset:-1px}.fbar select{cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:0 24px 10px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:border-color .15s,background .15s}
.chip b{font-weight:600;color:var(--mut);font-size:12.5px}.chip:hover{border-color:var(--p)}.chip.on{background:var(--grad);border-color:transparent;color:#fff}.chip.on b{color:#ffffffcc}
[data-theme=dark] .chip.on{color:#1a0b33}[data-theme=dark] .chip.on b{color:#1a0b33b3}
.chip.ftog{background:transparent;border-style:dashed;color:var(--mut)}.chip.ftog.open{border-style:solid;color:var(--p);border-color:var(--p);background:var(--pl)}.chip.ftog b{background:var(--p);color:#fff;border-radius:999px;min-width:18px;height:18px;display:inline-grid;place-items:center;padding:0 5px;font-size:11.5px}
[data-theme=dark] .chip.ftog b{color:#1a0b33}
.clr{border:0;background:none;color:var(--bad);cursor:pointer;font-size:13px;padding:4px 6px;font-weight:500}.clr:hover{text-decoration:underline}
.cnt.sum{padding:0 24px 12px}
/* kanban */
.board{scrollbar-color:var(--line2) transparent;display:grid;grid-template-columns:repeat(var(--n,6),minmax(0,1fr));gap:12px;align-items:stretch;padding:4px 24px 16px;height:calc(100vh - 230px);min-height:340px}
.col{--cc:var(--line2);min-width:0;min-height:0;display:flex;flex-direction:column;border-radius:14px;padding:0 0 8px;transition:background .15s;background:var(--col)}
.col[data-col=new],.col[data-col=lead]{--cc:var(--warn)}.col[data-col=quoted],.col[data-col=pay],.col[data-col=open]{--cc:var(--info)}.col[data-col=review]{--cc:#e0743b}.col[data-col=won],.col[data-col=customer]{--cc:var(--ok)}.col[data-col=closed],.col[data-col=lost]{--cc:#a3aea8}
.col.over{background:var(--pl);outline:2px dashed var(--p);outline-offset:-2px}.col.fold{flex-basis:56px;min-width:56px}
.ch{display:flex;align-items:center;gap:8px;padding:13px 14px 0}.ch::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--cc);flex:none}.ch b{font:650 15px var(--fd);flex:1;letter-spacing:-.01em}
.ch .plus{border:0;background:none;cursor:pointer;color:var(--mut);display:grid;place-items:center;width:26px;height:26px;border-radius:7px}.ch .plus:hover{background:var(--hover);color:var(--p)}
.prog{display:flex;align-items:center;gap:8px;padding:2px 14px 10px 31px}.prog i{display:none}.prog span{font:600 13px var(--fu);color:var(--mut);white-space:nowrap;font-variant-numeric:tabular-nums}.prog span.z{font-weight:500}
.cards{padding:0 9px;overflow-y:auto;overflow-x:hidden;flex:1;min-height:0;scrollbar-width:thin}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 13px;margin-bottom:8px;cursor:grab;user-select:none;transition:box-shadow .15s,border-color .15s}
.card.od{display:flex;gap:11px;align-items:flex-start}.card .cb{min-width:0;flex:1}
.card:hover{border-color:var(--line2);box-shadow:0 4px 14px #1d142814}
.spin svg{animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.card.drag{opacity:.3;outline:2px dashed var(--p);outline-offset:-2px;box-shadow:none}body.dragging,body.dragging *{user-select:none!important;cursor:grabbing!important}
.ghost{position:fixed;z-index:10000;margin:0!important;pointer-events:none;opacity:1!important;transform:rotate(8deg) scale(1.03);transform-origin:30% 20%;box-shadow:0 20px 40px rgba(0,0,0,.3);transition:transform .14s ease,box-shadow .14s ease}
.card .t{font-size:14.5px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}.card .t .oid{color:var(--mut);font-weight:500;margin-right:5px;font-variant-numeric:tabular-nums}
.card .a{font-size:13px;color:var(--mut);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .who{display:flex;align-items:center;gap:7px;margin:7px 0 2px;font-size:13px;color:var(--mut)}
.card .ft{display:flex;flex-wrap:wrap;align-items:center;gap:6px 7px;margin-top:8px;color:var(--mut);font-size:12.5px}.card .ft .sp{flex:1}.card .ft .tag{overflow:hidden;text-overflow:ellipsis;max-width:100%}
.card .amt{font:650 15px var(--fd);color:var(--ink);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.card.od .ft{justify-content:space-between;margin-top:6px}.stars{display:inline-flex;gap:1px;opacity:.0;transition:opacity .12s}.card:hover .stars,.stars:has(.on),.stars:focus-within{opacity:1}.stars svg{cursor:pointer;width:14px;height:14px;color:var(--line2);transition:color .12s}.stars svg.on{color:#e8a800;fill:#e8a800}.stars svg:hover{color:#e8a800}
/* the delivery day: the one memorable thing */
.dd{flex:none;width:46px;border-radius:10px;border:1px solid var(--line);background:var(--bg);text-align:center;padding:5px 0 6px;line-height:1.05}
.dd small{display:block;font-size:11.5px;font-weight:600;color:var(--mut);text-transform:none}.dd b{display:block;font:650 21px/1.1 var(--fd);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.dd.none{background:transparent;border-style:dashed}.dd.none b{color:var(--line2);font-size:17px}
.dd.over{background:#fff;border-color:var(--accent);color:var(--accent)}.dd.over small{color:var(--accent)!important}[data-theme=dark] .dd.over{background:#f472b620}.dd.over b{color:var(--accent)}.dd.over small{color:#ffffffd9}
.dd.today{background:var(--grad);border-color:transparent;color:#fff}.dd.today small{color:#ffffffd9}
.dd.tom{background:#d99a0022;border-color:#d99a0066}.dd.tom small{color:#8a6100}[data-theme=dark] .dd.tom small{color:var(--warn)}
[data-theme=dark] .dd.today{color:#1a0b33}[data-theme=dark] .dd.today small{color:#1a0b33cc}[data-theme=dark] .dd.over{color:#2b0612}[data-theme=dark] .dd.over small{color:#2b0612cc}
.dd.big{width:58px;padding:7px 0 8px}.dd.big b{font-size:26px}
/* chips for status and money */
.flag{display:inline-block;font-size:11.5px;border-radius:6px;padding:1px 7px;background:var(--pl);color:var(--p);font-weight:600;line-height:18px}.flag.w{background:#d99a0022;color:#7a5600}
.tag{display:inline-block;border-radius:999px;padding:0 9px;font-size:12px;font-weight:600;background:var(--pl);color:var(--p);white-space:nowrap;line-height:20px}
.s-pending,.s-quote{background:#d99a0024;color:#7a5600}.s-quoted,.s-awaiting_payment{background:#2b7bb91f;color:#1d5a86}.s-payment_review{background:#e0743b24;color:#9a4313}.s-confirmed,.s-completed{background:#2f8f5b20;color:#1f6b44}
.flag.ok{background:#2f8f5b20;color:#1f6b44}.flag.bad{background:#d6336c18;color:#a42a50}.flag.part{background:#d99a0024;color:#7a5600}.s-rejected,.s-cancelled{background:#66736d1f;color:#56625c}
[data-theme=dark] .flag.w,[data-theme=dark] .s-pending,[data-theme=dark] .s-quote,[data-theme=dark] .flag.part{background:#e7b34126;color:#f0c969}
[data-theme=dark] .s-quoted,[data-theme=dark] .s-awaiting_payment{background:#5aa8e026;color:#8cc4ee}[data-theme=dark] .s-payment_review{background:#e0743b30;color:#f3a273}
[data-theme=dark] .s-confirmed,[data-theme=dark] .s-completed,[data-theme=dark] .flag.ok{background:#4cc38a26;color:#7fd9a4}[data-theme=dark] .flag.bad{background:#ef6b8f26;color:#f598b0}[data-theme=dark] .s-rejected,[data-theme=dark] .s-cancelled{background:#8da09726;color:#a9b8b0}
/* lists */
.wrap{overflow-x:auto;background:var(--panel);margin:4px 24px 16px;border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--mut);font-weight:600;font-size:13px;padding:11px 14px;border-bottom:1px solid var(--line);background:transparent;white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}tr:last-child td{border-bottom:0}tbody tr:hover td,tr:hover>td{background:var(--hover)}
th.sortable{cursor:pointer;user-select:none}th.sortable:hover{color:var(--p)}th.sortable i{font-style:normal;font-size:10px;margin-left:3px;color:var(--p)}
.acts{display:flex;gap:6px;flex-wrap:wrap}.empty{padding:40px 16px;text-align:center;color:var(--mut)}
/* dialogs */
.modal{position:fixed;inset:0;background:#1d142899;display:flex;align-items:flex-start;justify-content:center;padding:7vh 16px 16px;z-index:20;animation:fade .15s;backdrop-filter:blur(2px)}
@keyframes fade{from{opacity:0}}@media(prefers-reduced-motion:reduce){.modal{animation:none}*{transition:none!important}}
.box{background:var(--panel);border-radius:18px;width:min(620px,100%);max-height:86vh;overflow:auto;box-shadow:0 24px 60px #1d142859;padding:0}
.box>table{width:calc(100% - 44px);table-layout:fixed;margin:6px 22px}.box>table td:first-child{overflow-wrap:anywhere}
.box>h3{margin:0;padding:18px 22px 14px;font:650 19px/1.3 var(--fd);letter-spacing:-.015em;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.box>*:not(h3){margin-left:22px;margin-right:22px}.box>h3+*{margin-top:4px}
.f{display:grid;gap:12px}.f label{display:grid;gap:5px;font-size:13px;color:var(--mut);font-weight:500}
