<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flower Shop Agent Console</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--rose:#c2456b;--rose2:#f6dfe6;--leaf:#2f4a3a;--cream:#fbf5f0;--ink:#2a2227;--mut:#8a7d83}
*{box-sizing:border-box}body{margin:0;font:15px Inter,system-ui,sans-serif;background:radial-gradient(circle at 10% 0,#fde9ee,#fbf5f0 50%);color:var(--ink);min-height:100vh}
header{padding:18px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{font:600 28px 'Cormorant Garamond',Georgia,serif;margin:0;color:var(--leaf)}header small{color:var(--mut)}
main{display:block;padding:0 12px 16px;max-width:560px;margin:auto}
.switch{display:flex;gap:8px;padding:0 12px 10px;max-width:560px;margin:auto}.switch button{flex:1;height:46px;border:0;border-radius:12px;background:#fff;color:var(--leaf);font:600 15px Inter,system-ui,sans-serif;box-shadow:0 2px 8px #0001;cursor:pointer;position:relative}.switch button.on{background:var(--leaf);color:#fff}.switch .dot{position:absolute;top:6px;right:10px;min-width:18px;height:18px;border-radius:9px;background:var(--rose);color:#fff;font-size:11px;line-height:18px;padding:0 5px}
details{margin-top:12px}summary{cursor:pointer;color:var(--mut);padding:6px 2px}
@media(max-width:600px){header{padding:12px 14px}h1{font-size:23px}header small{display:none}.bar{flex-wrap:wrap}.bar input{width:44%;font-size:16px}.send{gap:4px;padding:8px}.send input[type=text]{font-size:16px;min-width:0;padding:9px 12px}.ib,.go{width:36px;height:36px;font-size:15px;flex:none}.phone{border-radius:16px}}
.phone{background:#fff;border-radius:22px;box-shadow:0 10px 40px #c2456b22;overflow:hidden;display:flex;flex-direction:column;height:calc(100dvh - 200px);min-height:380px}
.tabs{display:flex;background:var(--leaf)}.tabs button{flex:1;padding:12px;border:0;background:none;color:#cfe0d5;font:500 14px inherit;cursor:pointer}
.tabs button.on{color:#fff;box-shadow:inset 0 -3px var(--rose2)}
.bar{padding:8px 12px;background:var(--rose2);display:flex;gap:8px;align-items:center;font-size:13px}
.bar input{border:1px solid #e8c9d3;border-radius:8px;padding:5px 8px;width:130px;font:inherit}
.chat{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:6px;background:#f7efe9}
.b{max-width:82%;padding:8px 11px;border-radius:14px;white-space:pre-wrap;word-break:break-word;box-shadow:0 1px 2px #0001}
.me{align-self:flex-end;background:#dff3d9;border-bottom-right-radius:4px}.bot{align-self:flex-start;background:#fff;border-bottom-left-radius:4px}
.b img{max-width:200px;border-radius:8px;display:block}.tag{font-size:11px;color:var(--rose);display:block;margin-bottom:2px}
.b a{color:var(--rose);font-weight:500}
.send{display:flex;gap:6px;padding:10px;border-top:1px solid #eee;align-items:center}
.send input[type=text]{flex:1;border:1px solid #e6dde1;border-radius:20px;padding:9px 14px;font:inherit}
.ib,.go{border:0;border-radius:50%;width:38px;height:38px;cursor:pointer;background:var(--rose2);font-size:17px}.go{background:var(--rose);color:#fff}
.rec{background:#e33!important;color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:6px 10px 0}.chips button{border:1px solid var(--rose);background:#fff;color:var(--rose);border-radius:14px;padding:3px 10px;cursor:pointer;font:12px inherit}
.log{background:#2a2227;color:#eadde2;border-radius:16px;padding:14px;height:22vh;min-height:160px;overflow:auto;font:12.5px ui-monospace,monospace}
.log h3{margin:0 0 10px;font:600 20px 'Cormorant Garamond',serif;color:#f6dfe6}
.l{padding:3px 0;border-bottom:1px solid #ffffff12}.l i{color:#9c8c94;font-style:normal}.al{color:#ffcf6b}.tp{color:#8fd3ff}
.hide{display:none!important}
.nav3{display:flex;gap:6px;margin-left:auto}.nav3 a{padding:6px 12px;border-radius:10px;background:#fff;color:var(--leaf);text-decoration:none;font:600 13px Inter,system-ui,sans-serif;box-shadow:0 1px 4px #0001}.nav3 a.on{background:var(--leaf);color:#fff}
html.embed .nav3{display:none!important}
</style><script>if(location.search.includes('embed'))document.documentElement.classList.add('embed')</script></head><body>
<header><h1>🌸 North Cyprus Flower</h1><small>agent test console · <span id="mode"></span></small><nav class="nav3"><a href="/" class="on">Chat</a><a href="/simulate">Simulation</a><a href="/dashboard">Dashboard</a></nav></header>
<div class="switch"><button id="tu" class="on">👤 User</button><button id="ta">🛠 Admin</button></div>
<main>
<div class="phone" id="pu">
  <div class="tabs"><button class="on">👤 Customer (WhatsApp)</button></div>
  <div id="cust" style="display:contents">
    <div class="bar">Number <input id="num" inputmode="numeric"> Name <input id="nm"><button style="border:1px solid var(--rose);background:#fff;border-radius:12px;cursor:pointer" id="newc">new customer</button></div>
    <div class="chat" id="c1"></div>
    <div class="send"><label class="ib" title="photo" style="display:grid;place-items:center">📷<input id="img" type="file" accept="image/*" hidden></label>
      <label class="ib" title="PDF / receipt" style="display:grid;place-items:center">📎<input id="doc" type="file" accept="application/pdf,.pdf" hidden></label>
      <label class="ib" title="voice file" style="display:grid;place-items:center">🎵<input id="aud" type="file" accept="audio/*" hidden></label>
      <button class="ib" id="rec" title="record voice">🎤</button>
      <input type="text" id="m1" placeholder="Write a message…"><button class="go" id="g1">➤</button></div>
  </div>
</div>
<div class="phone hide" id="pa">
  <div class="tabs"><button class="on">🛠 Admin (WhatsApp)</button></div>
  <div id="adm" style="display:contents">
    <div class="bar">Admin number: <b id="an"></b></div>
        <div class="chat" id="c2"></div>
    <div class="bar hide" id="rto">↩ replying to: <i id="rtxt"></i> <button id="rx" style="border:0;background:none;cursor:pointer">✕</button></div>
    <div class="send"><input type="text" id="m2" placeholder="Write to your assistant in plain words…"><button class="go" id="g2">➤</button></div>
  </div>
</div>
<details><summary>Live feed &amp; alerts</summary><div class="log" id="log"></div></details>
</main>
<script>
const $=id=>document.getElementById(id);let replyTo='',admin='',since=0,mr=null,chunks=[],t0=0;
const digits=s=>s.replace(/\D/g,'');
fetch('/config').then(r=>r.json()).then(c=>{admin=c.admin;$('an').textContent=admin||'(set ADMIN_NUMBERS)';$('mode').textContent=(c.mock?'MOCK mode':'LIVE')+' · debounce '+c.debounce+'s'});
function bubble(box,cls,html,tag){const d=document.createElement('div');d.className='b '+cls;d.innerHTML=(tag?`<span class="tag">${tag}</span>`:'')+html;box.append(d);box.scrollTop=1e9;return d}
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const link=s=>esc(s).replace(/(https?:\/\/[^\s]+)/g,'<a href="$1" target="_blank">$1</a>').replace(/\*([^*\n]+)\*/g,'<b>$1</b>');
async function post(from,name,text,file,dur){const f=new FormData();if(from==admin&&replyTo){f.append('reply_to',replyTo);clearReply()}f.append('from',from);f.append('name',name);f.append('text',text||'');if(file)f.append('file',file,file.name||'voice.webm');f.append('duration',dur||0);await fetch('/message',{method:'POST',body:f})}
function sendCust(){const t=$('m1').value.trim();if(!t)return;$('m1').value='';bubble($('c1'),'me',link(t));post($('num').value,$('nm').value,t)}
$('g1').onclick=sendCust;$('m1').onkeydown=e=>{if(e.key=='Enter')sendCust()};
$('img').onchange=e=>{const f=e.target.files[0];if(!f)return;bubble($('c1'),'me',`<img src="${URL.createObjectURL(f)}">`);post($('num').value,$('nm').value,'',f);e.target.value=''};
$('doc').onchange=e=>{const f=e.target.files[0];if(!f)return;bubble($('c1'),'me','📎 '+esc(f.name));post($('num').value,$('nm').value,'',f);e.target.value=''};
$('aud').onchange=e=>{const f=e.target.files[0];if(!f)return;const a=new Audio(URL.createObjectURL(f));a.onloadedmetadata=()=>{bubble($('c1'),'me',`🎵 ${f.name} (${Math.round(a.duration)}s)`);post($('num').value,$('nm').value,'',f,a.duration)};a.onerror=()=>{bubble($('c1'),'me','🎵 '+f.name);post($('num').value,$('nm').value,'',f,0)};e.target.value=''};
$('rec').onclick=async()=>{if(mr&&mr.state=='recording'){mr.stop();return}
 try{const s=await navigator.mediaDevices.getUserMedia({audio:true});mr=new MediaRecorder(s);chunks=[];t0=Date.now();
 mr.ondataavailable=e=>chunks.push(e.data);mr.onstop=()=>{s.getTracks().forEach(t=>t.stop());$('rec').classList.remove('rec');const d=(Date.now()-t0)/1000,b=new Blob(chunks,{type:'audio/webm'});b.name='voice.webm';bubble($('c1'),'me',`🎤 voice note (${Math.round(d)}s)`);post($('num').value,$('nm').value,'',b,d)};
 mr.start();$('rec').classList.add('rec')}catch(e){alert('Microphone not available: '+e.message)}};
const NAMES=['Ayşe','Mehmet','Elif','Can','Zeynep','Hasan','Maria','John','Sara','Omer','Leyla','Murat','Deniz','Natasha','Ahmed','Selin'],SURNAMES=['Demir','Kaya','Yilmaz','Smith','Brown','Ivanov','Petrova','Arslan','Aydin','Miller'];
const rnd=a=>a[Math.floor(Math.random()*a.length)];
function newIdentity(){let used=[];try{used=JSON.parse(localStorage.getItem('testchatused')||'[]')}catch(e){}let num,name;do{num='9053'+Math.floor(1e7+Math.random()*9e7)}while(used.some(x=>x.num===num)||num===admin.replace(/\D/g,''));do{name=rnd(NAMES)+' '+rnd(SURNAMES)}while(used.some(x=>x.name===name));used.push({num,name});localStorage.setItem('testchatused',JSON.stringify(used));$('num').value=num;$('nm').value=name;$('c1').innerHTML=''}  // keep test identities synthetic and never reuse them
$('newc').onclick=newIdentity;newIdentity();
let cur='u',unread={u:0,a:0};
function badge(){for(const[k,id,l]of[['u','tu','👤 User'],['a','ta','🛠 Admin']]){$(id).innerHTML=l+(unread[k]?`<span class="dot">${unread[k]}</span>`:'')}}
function view(v){cur=v;unread[v]=0;$('pu').classList.toggle('hide',v!='u');$('pa').classList.toggle('hide',v!='a');$('tu').classList.toggle('on',v=='u');$('ta').classList.toggle('on',v=='a');badge();setTimeout(()=>{const c=$(v=='u'?'c1':'c2');c.scrollTop=1e9},0)}
$('tu').onclick=()=>view('u');$('ta').onclick=()=>view('a');
function sendAdmin(t){bubble($('c2'),'me',esc(t));post(admin,'Admin',t)}
$('g2').onclick=()=>{const t=$('m2').value.trim();if(t){$('m2').value='';sendAdmin(t)}};$('m2').onkeydown=e=>{if(e.key=='Enter')$('g2').click()};
let lastEvt=0,oid='1';
function show(e){lastEvt=Date.now();const mo=(e.body||'').match(/Order #(\d+)/);if(mo)oid=mo[1];const to=digits(e.to||'');const html=(e.kind=='image'?`<img src="/download/${e.file}" style="max-width:220px;border-radius:8px;display:block;margin-bottom:4px">`:'')+link(e.body||'')+(e.file?`<br>📎 <a href="/download/${e.file}">download ${esc(e.file.split('_').slice(1).join('_'))}</a>`:'');
 const tag=e.kind=='template'?'template: '+e.tpl:'';
 if(to&&to==digits($('num').value)){bubble($('c1'),'bot',html);if(cur!='u'){unread.u++;badge()}}
 if(to&&to==digits(admin)){if(cur!='a'){unread.a++;badge()}const b=bubble($('c2'),'bot',html,tag);b.title='click to reply to this message';b.style.cursor='pointer';b.onclick=()=>{replyTo='f'+e.id;$('rtxt').textContent=(e.body||'').slice(0,70);$('rto').classList.remove('hide');$('m2').focus()}}
 const d=document.createElement('div');d.className='l '+(to==digits(admin)?'al':e.kind=='log'?'tp':'');
 d.innerHTML=`<i>${e.ts}</i> ${e.kind=='log'?'':'→ '+(to==digits(admin)?'ADMIN':to)+' '}${tag?'['+tag+'] ':''}${esc((e.body||'').slice(0,240))}${e.file?' 📎':''}`;$('log').append(d);$('log').scrollTop=1e9}
setInterval(async()=>{if(document.hidden)return;try{const r=await fetch('/feed?since='+since);if(!r.ok)return;const a=await r.json();a.forEach(e=>{show(e);since=e.id})}catch(e){}},2500);
function clearReply(){replyTo='';$('rto').classList.add('hide')}$('rx').onclick=clearReply;

// the page words in the dashboard's language (Turkish / Russian); English stays as written
(()=>{const L=localStorage.getItem('dl')||(navigator.language||'en').slice(0,2);
const M={tr:{'agent test console · ':'asistan test konsolu · ','Chat':'Sohbet','Simulation':'Simülasyon','Dashboard':'Pano','👤 User':'👤 Müşteri','🛠 Admin':'🛠 Yönetici','👤 Customer (WhatsApp)':'👤 Müşteri (WhatsApp)','🛠 Admin (WhatsApp)':'🛠 Yönetici (WhatsApp)','Number':'Numara','Name':'Ad','new customer':'yeni müşteri','Admin number:':'Yönetici numarası:','↩ replying to:':'↩ yanıt:','Live feed & alerts':'Canlı akış ve uyarılar','Write a message…':'Mesaj yazın…','Write to your assistant in plain words…':'Asistanınıza düz yazıyla yazın…','photo':'fotoğraf','PDF / receipt':'PDF / dekont','voice file':'ses dosyası','record voice':'ses kaydet'},
ru:{'agent test console · ':'тестовая консоль ассистента · ','Chat':'Чат','Simulation':'Симуляция','Dashboard':'Панель','👤 User':'👤 Клиент','🛠 Admin':'🛠 Админ','👤 Customer (WhatsApp)':'👤 Клиент (WhatsApp)','🛠 Admin (WhatsApp)':'🛠 Админ (WhatsApp)','Number':'Номер','Name':'Имя','new customer':'новый клиент','Admin number:':'Номер админа:','↩ replying to:':'↩ ответ на:','Live feed & alerts':'Лента и уведомления','Write a message…':'Напишите сообщение…','Write to your assistant in plain words…':'Напишите ассистенту обычными словами…','photo':'фото','PDF / receipt':'PDF / чек','voice file':'аудиофайл','record voice':'записать голос'}}[L];
if(!M)return;document.documentElement.lang=L;
const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){const t=n.nodeValue.trim();if(M[t])n.nodeValue=n.nodeValue.replace(t,M[t])}
document.querySelectorAll('[placeholder],[title]').forEach(e=>{for(const k of ['placeholder','title'])if(e.getAttribute(k)&&M[e.getAttribute(k)])e.setAttribute(k,M[e.getAttribute(k)])})})();
</script></body></html>
